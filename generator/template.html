<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo pose guide</title>
<meta name="description" content="__COUNT__ illustrated photo poses for solo, partner and group shots, with posing and framing tips. Filter by type, setting, shot and angle.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%B8%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#ECEFF2;--surface:#FFFFFF;--ink:#1C2733;--muted:#566373;--line:#C7D0D9;--accent:#0E6E6A;--accent-ink:#FFFFFF;
  --star:#9A6400;--veil:rgba(20,28,37,.72);--frame:#FFFFFF;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161C;--surface:#19212A;--ink:#E9EEF3;--muted:#A3AFBC;--line:#34414E;--accent:#5CCBC6;--accent-ink:#082120;
    --star:#F2C14E;--veil:rgba(4,8,12,.8);--frame:#19212A;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161C;--surface:#19212A;--ink:#E9EEF3;--muted:#A3AFBC;--line:#34414E;--accent:#5CCBC6;--accent-ink:#082120;
  --star:#F2C14E;--veil:rgba(4,8,12,.8);--frame:#19212A;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding:0 clamp(20px,5vw,36px)}

.intro{padding-top:clamp(22px,4vw,44px);padding-bottom:14px}
.intro h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(2.1rem,6vw,3.6rem);line-height:1.02;letter-spacing:-.02em}
.intro p{margin:.6rem 0 0;max-width:62ch;color:var(--muted);font-size:1.05rem}

.filters{border-top:1px solid var(--line);padding:6px 0 2px}
.filters summary{list-style:none;display:flex;align-items:center;gap:.55rem;min-height:2.75rem;margin:8px 0;padding:.3rem .95rem;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:600;cursor:pointer;width:max-content}
.filters summary .ico{width:1.15rem;height:1.15rem;flex:none}
.filters[open] summary{margin-bottom:12px}
.filters summary::-webkit-details-marker{display:none}
.filters summary::after{content:"";width:.5rem;height:.5rem;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .15s}
.filters[open] summary::after{transform:rotate(-135deg) translateY(-2px)}
.group{display:grid;grid-template-columns:5.2rem minmax(0,1fr);gap:.4rem .6rem;align-items:start;padding:.35rem 0}
.group h2{margin:.42rem 0 0;font-size:.9rem;font-weight:600;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{min-height:2.5rem;padding:.3rem .8rem;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:500;font-size:.95rem;display:inline-flex;align-items:center;gap:.45rem}
.chip .n{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.85}
.search{width:min(100%,22rem);min-height:2.75rem;padding:.4rem .9rem;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.search::placeholder{color:var(--muted)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-top:6px}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .9rem;padding-top:.55rem;padding-bottom:.55rem}
.bar .count{margin:0 auto 0 0;font-weight:600;font-variant-numeric:tabular-nums}
.plain{min-height:2.75rem;padding:.3rem .9rem;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:500}
.plain[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.plain:disabled{opacity:.45;cursor:default}

.grid{list-style:none;margin:0;padding:18px 0 64px;display:grid;gap:22px 14px;grid-template-columns:repeat(auto-fill,minmax(min(46%,188px),1fr))}
.pose{display:block;width:100%;padding:0;border:0;background:none;text-align:left}
.frame{position:relative;display:block;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--line)}
.frame svg{display:block;width:100%;height:100%}
.frame::before,.frame::after{content:"";position:absolute;width:16%;aspect-ratio:1;border:3px solid #fff;opacity:0;transition:opacity .12s;pointer-events:none;z-index:1}
.frame::before{left:7%;top:5.5%;border-right:0;border-bottom:0}
.frame::after{right:7%;bottom:5.5%;border-left:0;border-top:0}
.pose:hover .frame::before,.pose:hover .frame::after,.pose:focus-visible .frame::before,.pose:focus-visible .frame::after{opacity:.95}
.cap{display:flex;gap:.5rem;align-items:baseline;margin-top:.5rem}
.num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;min-width:1.7rem}
.name{font-family:var(--display);font-weight:700;font-size:1.06rem;line-height:1.2}
.saved-mark{margin-left:auto;color:var(--star);font-size:.95rem}
.meta{display:block;margin:.1rem 0 0 2.2rem;color:var(--muted);font-size:.85rem;line-height:1.35}
.empty{padding:48px 0 96px;max-width:46ch}
.empty p{margin:0 0 1rem;font-size:1.1rem}

dialog{width:min(1120px,100vw);max-width:100vw;max-height:100dvh;height:auto;margin:auto;padding:0;border:0;border-radius:16px;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:var(--veil)}
.viewer{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:0;max-height:min(100dvh,900px)}
.shot{position:relative;height:min(100dvh,900px);aspect-ratio:3/4;background:var(--line);touch-action:pan-y}
.shot svg{display:block;width:100%;height:100%}
.thirds-g{display:none;pointer-events:none}
body.thirds .thirds-g{display:inline}
.thirds-g line{vector-effect:non-scaling-stroke}
.info{display:flex;flex-direction:column;gap:.2rem;padding:clamp(22px,3vw,36px);overflow:auto;max-height:min(100dvh,900px)}
.pos{margin:0;color:var(--muted);font-variant-numeric:tabular-nums}
.info h2{margin:.1rem 3rem .5rem 0;font-family:var(--display);font-weight:700;font-size:clamp(1.9rem,4vw,2.8rem);line-height:1.05;letter-spacing:-.015em}
.tags{list-style:none;margin:0 0 .6rem;padding:0;display:flex;flex-wrap:wrap;gap:.35rem}
.tags li{padding:.15rem .65rem;border:1px solid var(--line);border-radius:999px;font-size:.88rem}
.info h3{margin:.9rem 0 .15rem;font-size:.95rem;font-weight:600;color:var(--muted)}
.info p.tip{margin:0;font-size:1.08rem;max-width:44ch}
.actions{display:flex;flex-wrap:wrap;gap:.5rem .9rem;align-items:center;margin-top:1.3rem}
.switch{display:inline-flex;align-items:center;gap:.6rem;min-height:2.75rem;padding:0;border:0;background:none;font-weight:500}
.switch .track{position:relative;flex:none;width:2.75rem;height:1.6rem;border-radius:999px;background:var(--muted);transition:background .15s}
.switch .track::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.2rem;height:1.2rem;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform .15s}
.switch[aria-checked="true"] .track{background:var(--accent)}
.switch[aria-checked="true"] .track::after{transform:translateX(1.15rem)}
.save[aria-pressed="true"]{background:var(--star);border-color:var(--star);color:var(--surface)}
.nav{display:flex;gap:.5rem;margin-top:auto;padding-top:1.2rem}
.nav .plain{flex:1}
.close{position:absolute;top:10px;right:10px;width:2.75rem;height:2.75rem;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:1.4rem;line-height:1}
@media (max-width:760px){
  dialog{width:100vw;height:100dvh;max-height:100dvh;border-radius:0}
  .viewer{grid-template-columns:minmax(0,1fr);max-height:none;height:100dvh;overflow:auto;align-content:start}
  .shot{height:auto;width:100%;max-height:none}
  .info{max-height:none;overflow:visible;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
  .close{position:fixed;top:calc(10px + env(safe-area-inset-top,0px))}
  .group{grid-template-columns:minmax(0,1fr);gap:.2rem}
  .group h2{margin:0}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<header class="wrap intro">
  <h1>Photo pose guide</h1>
  <p>__COUNT__ poses for solo, partner and group photos. Narrow them down by type, open one for posing and framing tips, and save the ones you want to try.</p>
</header>

<div class="wrap">
  <details class="filters" id="filters">
    <summary><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Filter poses</summary>
    <div id="groups"></div>
    <div class="group"><h2><label for="q">Search</label></h2><div><input class="search" id="q" type="search" placeholder="Try “bench” or “window”" autocomplete="off"></div></div>
  </details>
</div>

<div class="bar">
  <div class="wrap">
    <p class="count" id="count" aria-live="polite"></p>
    <button class="switch" id="gridToggle" type="button" role="switch" aria-checked="false"><span class="track" aria-hidden="true"></span>Grid lines</button>
    <button class="plain" id="savedOnly" type="button" aria-pressed="false">Saved</button>
    <button class="plain" id="clear" type="button">Clear filters</button>
  </div>
</div>

<main class="wrap">
  <ul class="grid" id="grid"></ul>
  <div class="empty" id="empty" hidden>
    <p id="emptyText"></p>
    <button class="plain" id="clear2" type="button">Clear filters</button>
  </div>
</main>

<dialog id="viewer" aria-labelledby="vTitle">
  <div class="viewer">
    <div class="shot" id="vShot">
      <div id="vArt"></div>
    </div>
    <div class="info">
      <p class="pos" id="vPos"></p>
      <h2 id="vTitle"></h2>
      <ul class="tags" id="vTags"></ul>
      <h3>Pose</h3>
      <p class="tip" id="vPose"></p>
      <h3>Framing</h3>
      <p class="tip" id="vFrame"></p>
      <div class="actions">
        <button class="plain save" id="vSave" type="button" aria-pressed="false">Save pose</button>
        <button class="switch" id="vGrid" type="button" role="switch" aria-checked="false"><span class="track" aria-hidden="true"></span>Grid lines</button>
      </div>
      <div class="nav">
        <button class="plain" id="vPrev" type="button">Previous</button>
        <button class="plain" id="vNext" type="button">Next</button>
      </div>
    </div>
    <button class="close" id="vClose" type="button" aria-label="Close pose">×</button>
  </div>
</dialog>

<script id="poses" type="application/json">__DATA__</script>
<script>
(function(){
  var DATA = JSON.parse(document.getElementById('poses').textContent);
  var CARDS = DATA.cards, GROUPS = DATA.groups;
  var $ = function(id){ return document.getElementById(id); };
  var store = {
    get: function(k, d){ try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  var sel = {}, query = '', savedOnly = false, list = [], openIdx = -1;
  var saved = {}; (store.get('pose-saved', []) || []).forEach(function(n){ saved[n] = true; });
  var showThirds = store.get('pose-thirds', true) !== false;

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  var THIRDS = '<g class="thirds-g" stroke="#fff" stroke-width="1.25" opacity=".8" aria-hidden="true"><line x1="200" y1="0" x2="200" y2="800"/><line x1="400" y1="0" x2="400" y2="800"/><line x1="0" y1="266.7" x2="600" y2="266.7"/><line x1="0" y1="533.3" x2="600" y2="533.3"/></g>';
  function svg(c){ return '<svg viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="' + esc('Pose ' + c.n + ', ' + c.t) + '">' + c.a + THIRDS + '</svg>'; }
  function applyThirds(){
    document.body.classList.toggle('thirds', showThirds);
    $('gridToggle').setAttribute('aria-checked', showThirds ? 'true' : 'false');
    $('vGrid').setAttribute('aria-checked', showThirds ? 'true' : 'false');
  }
  function lower(tags){ return tags.slice(0, 3).map(function(t, i){ return i ? t.toLowerCase() : t; }).join(', '); }

  // filter chips
  var counts = {};
  CARDS.forEach(function(c){ c.g.forEach(function(t){ counts[t] = (counts[t] || 0) + 1; }); });
  $('groups').innerHTML = GROUPS.map(function(g){
    return '<div class="group"><h2>' + esc(g[0]) + '</h2><div class="chips">' + g[1].map(function(t){
      return '<button class="chip" type="button" aria-pressed="false" data-tag="' + esc(t) + '">' + esc(t) + '<span class="n">' + (counts[t] || 0) + '</span></button>';
    }).join('') + '</div></div>';
  }).join('');
  $('groups').addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if (!b) return;
    var t = b.getAttribute('data-tag'); sel[t] = !sel[t];
    b.setAttribute('aria-pressed', sel[t] ? 'true' : 'false');
    render();
  });
  $('q').addEventListener('input', function(){ query = this.value.trim().toLowerCase(); render(); });
  $('savedOnly').addEventListener('click', function(){ savedOnly = !savedOnly; this.setAttribute('aria-pressed', savedOnly ? 'true' : 'false'); render(); });
  function clearAll(){
    sel = {}; query = ''; savedOnly = false; $('q').value = '';
    $('savedOnly').setAttribute('aria-pressed', 'false');
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function(b){ b.setAttribute('aria-pressed', 'false'); });
    render();
  }
  $('clear').addEventListener('click', clearAll);
  $('clear2').addEventListener('click', clearAll);

  function matches(c){
    if (savedOnly && !saved[c.n]) return false;
    if (query && (c.t + ' ' + c.p + ' ' + c.f + ' ' + c.g.join(' ')).toLowerCase().indexOf(query) < 0) return false;
    return GROUPS.every(function(g){
      var on = g[1].filter(function(t){ return sel[t]; });
      return !on.length || on.some(function(t){ return c.g.indexOf(t) >= 0; });
    });
  }

  // thumbnails are drawn only while near the viewport
  var io = ('IntersectionObserver' in window) ? new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      var f = en.target, c = CARDS[+f.getAttribute('data-i')];
      if (en.isIntersecting) { if (!f.firstChild) f.innerHTML = svg(c); }
      else if (f.firstChild) f.innerHTML = '';
    });
  }, { rootMargin: '700px 0px' }) : null;

  function render(){
    if (io) io.disconnect();
    list = [];
    CARDS.forEach(function(c, i){ if (matches(c)) list.push(i); });
    var filtered = Object.keys(sel).some(function(k){ return sel[k]; }) || query || savedOnly;
    $('count').textContent = filtered ? ('Showing ' + list.length + ' of ' + CARDS.length + ' poses') : (CARDS.length + ' poses');
    $('clear').disabled = !filtered;
    $('grid').innerHTML = list.map(function(i){
      var c = CARDS[i];
      return '<li><button class="pose" type="button" data-i="' + i + '" aria-label="' + esc('Open pose ' + c.n + ', ' + c.t) + '">' +
        '<span class="frame" data-i="' + i + '"></span>' +
        '<span class="cap"><span class="num">' + c.n + '</span><span class="name">' + esc(c.t) + '</span>' +
        (saved[c.n] ? '<span class="saved-mark" title="Saved">★</span>' : '') + '</span>' +
        '<span class="meta">' + esc(lower(c.g)) + '</span></button></li>';
    }).join('');
    var frames = document.querySelectorAll('.frame');
    Array.prototype.forEach.call(frames, function(f){ if (io) io.observe(f); else f.innerHTML = svg(CARDS[+f.getAttribute('data-i')]); });
    var none = !list.length;
    $('empty').hidden = !none; $('grid').hidden = none;
    if (none) $('emptyText').textContent = savedOnly && !Object.keys(saved).length
      ? 'You haven’t saved any poses yet. Open a pose and choose “Save pose” to start a shortlist.'
      : 'No poses match these filters. Remove a tag, change the search, or clear everything.';
  }
  $('grid').addEventListener('click', function(e){
    var b = e.target.closest('.pose'); if (!b) return;
    location.hash = 'pose-' + CARDS[+b.getAttribute('data-i')].n;
  });

  // viewer
  var dlg = $('viewer');
  function show(i){
    var c = CARDS[i]; openIdx = i;
    $('vArt').innerHTML = svg(c);
    var at = list.indexOf(i);
    $('vPos').textContent = 'Pose ' + c.n + (at >= 0 && list.length < CARDS.length ? ', ' + (at + 1) + ' of ' + list.length + ' shown' : ' of ' + CARDS.length);
    $('vTitle').textContent = c.t;
    $('vTags').innerHTML = c.g.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('');
    $('vPose').textContent = c.p; $('vFrame').textContent = c.f;
    var on = !!saved[c.n];
    $('vSave').setAttribute('aria-pressed', on ? 'true' : 'false');
    $('vSave').textContent = on ? 'Saved ★' : 'Save pose';
    if (!dlg.open) { if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', ''); }
    // showModal focuses the first control (Save, below the drawing) and scrolls to it, so move focus without scrolling and reset to the top
    try { $('vClose').focus({ preventScroll: true }); } catch (e) {}
    function top(){
      var info = dlg.querySelector('.info'); if (info) info.scrollTop = 0;
      var vw = dlg.querySelector('.viewer'); if (vw) vw.scrollTop = 0;
      dlg.scrollTop = 0;
    }
    top();
    if (window.requestAnimationFrame) requestAnimationFrame(top);
  }
  function step(d){
    var pool = list.length ? list : CARDS.map(function(_, i){ return i; });
    var at = pool.indexOf(openIdx); if (at < 0) at = 0;
    location.hash = 'pose-' + CARDS[pool[(at + d + pool.length) % pool.length]].n;
  }
  function route(){
    var m = /^#pose-(\d+)$/.exec(location.hash);
    var idx = -1;
    if (m) CARDS.forEach(function(c, i){ if (c.n === +m[1]) idx = i; });
    if (idx >= 0) show(idx);
    else if (dlg.open) { openIdx = -1; dlg.close(); }
  }
  $('vPrev').addEventListener('click', function(){ step(-1); });
  $('vNext').addEventListener('click', function(){ step(1); });
  $('vClose').addEventListener('click', function(){ location.hash = 'all'; });
  dlg.addEventListener('close', function(){ if (/^#pose-/.test(location.hash)) location.hash = 'all'; render(); });
  dlg.addEventListener('click', function(e){ if (e.target === dlg) location.hash = 'all'; });
  dlg.addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
  });
  $('vSave').addEventListener('click', function(){
    var c = CARDS[openIdx]; if (!c) return;
    if (saved[c.n]) delete saved[c.n]; else saved[c.n] = true;
    store.set('pose-saved', Object.keys(saved).map(Number));
    var on = !!saved[c.n];
    this.setAttribute('aria-pressed', on ? 'true' : 'false');
    this.textContent = on ? 'Saved ★' : 'Save pose';
  });
  function setThirds(on){ showThirds = on; store.set('pose-thirds', showThirds); applyThirds(); }
  $('vGrid').addEventListener('click', function(){ setThirds(!showThirds); });
  $('gridToggle').addEventListener('click', function(){ setThirds(!showThirds); });
  var sx = null;
  $('vShot').addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; }, { passive: true });
  $('vShot').addEventListener('touchend', function(e){
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
  }, { passive: true });

  $('filters').open = window.matchMedia('(min-width: 760px)').matches;
  applyThirds();
  render();
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
