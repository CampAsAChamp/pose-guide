<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo pose guide</title>
<meta name="description" content="__COUNT__ illustrated photo poses for solo, partner and group shots, with posing and framing tips. Filter by type, setting, shot and angle.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%B8%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
__CSS__
</style>
</head>
<body>
<header class="wrap intro">
  <h1>Photo pose guide</h1>
  <p>__COUNT__ poses for solo, partner and group photos. Narrow them down by type, open one for posing and framing tips, and save the ones you want to try.</p>
</header>

<div class="wrap">
  <div class="filters" id="filters">
    <div class="frow">
      <button class="fbtn" id="filterBtn" type="button" aria-expanded="false" aria-controls="filterPanel"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Filter poses<span class="badge" id="moreBadge" hidden></span></button>
      <button class="plain sbtn" id="savedOnly" type="button" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Saved</button>
      <button class="plain" id="clear" type="button" hidden>Clear filters</button>
    </div>
    <div id="filterPanel" hidden>
      <div id="groups"></div>
      <div class="group"><h2><label for="q">Search</label></h2><div><input class="search" id="q" type="search" placeholder="Try “bench” or “window”" autocomplete="off"></div></div>
    </div>
  </div>
  <div class="active" id="active" role="group" aria-label="Applied filters" hidden></div>
</div>

<div class="bar">
  <div class="wrap">
    <p class="count" id="count" aria-live="polite"></p>
    <button class="switch" id="gridToggle" type="button" role="switch" aria-checked="false"><span class="track" aria-hidden="true"></span><svg class="gico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>Grid lines</button>
  </div>
</div>

<main class="wrap">
  <ul class="grid" id="grid"></ul>
  <div class="empty" id="empty" hidden>
    <p id="emptyText"></p>
    <button class="plain" id="clear2" type="button">Clear filters</button>
  </div>
</main>

<dialog id="viewer" aria-labelledby="vTitle">
  <div class="viewer">
    <div class="shot" id="vShot">
      <div id="vArt"></div>
    </div>
    <div class="info">
      <p class="pos" id="vPos"></p>
      <h2 id="vTitle"></h2>
      <ul class="tags" id="vTags"></ul>
      <h3>Pose</h3>
      <p class="tip" id="vPose"></p>
      <h3>Framing</h3>
      <p class="tip" id="vFrame"></p>
      <div class="actions">
        <button class="plain save sbtn" id="vSave" type="button" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span id="vSaveLabel">Save pose</span></button>
        <button class="switch" id="vGrid" type="button" role="switch" aria-checked="false"><span class="track" aria-hidden="true"></span><svg class="gico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>Grid lines</button>
      </div>
      <div class="nav">
        <button class="plain" id="vPrev" type="button">Previous</button>
        <button class="plain" id="vNext" type="button">Next</button>
      </div>
    </div>
    <button class="close" id="vClose" type="button" aria-label="Close pose">×</button>
  </div>
</dialog>

<script id="poses" type="application/json">__DATA__</script>
<script>
__JS__
</script>
</body>
</html>
